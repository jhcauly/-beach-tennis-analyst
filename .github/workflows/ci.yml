name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q src tests
      - run: pytest -q
      - name: Lint dashboard changes
        run: >-
          ruff check
          src/beach_tennis_analyst/render/final_dashboard.py
          src/beach_tennis_analyst/render/performance_report.py
          tests/test_final_dashboard.py
